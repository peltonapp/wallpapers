name: Gallery

on:
  push:
    branches:
      - main
    paths:
      - "wallpapers/**"
      - "scripts/generate_gallery.py"
      - ".github/workflows/gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the gallery
        run: python scripts/generate_gallery.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Gallery is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -s -m "Update gallery"
          git push
