name: Build

on:
  push:
    branches:
      - main
    paths:
      - "wallpapers/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python -m pip install --upgrade pillow

      - name: Render exports from the SVGs
        run: python scripts/render_exports.py

      - name: Generate the gallery and manifest
        run: python scripts/generate_gallery.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Everything is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "Update exports, gallery and manifest"
          git push
